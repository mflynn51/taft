services:
  taft:
    image: taft
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    restart: unless-stopped
    # Not published to the host; Caddy is the only way in.
    expose:
      - 8000

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - taft
    ports:
      - 80:80
      - 443:443
    environment:
      # A domain name (e.g. taft.example.com) gets automatic HTTPS; ":80" serves plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Holds Caddy's HTTPS certificates; keep it so they survive restarts.
  caddy_data:
  caddy_config:
